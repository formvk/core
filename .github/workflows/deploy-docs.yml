name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
      - feat/reactive
    paths:
      - 'docs/**'
      - 'packages/**'
      - '.github/workflows/deploy-docs.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

# GITHUB_TOKEN 的 Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一个 Pages 部署，部署任务不允许被中途取消
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 文档 demo 通过包名引用 @formvk/*，各包入口指向 dist/，
      # 全新检出必须先按依赖拓扑构建全部工作区包
      - name: Build workspace packages
        run: pnpm -r build

      - name: Build docs
        run: pnpm docs:build
        env:
          # 仓库 formvk/core 的项目站点子路径
          DOCS_BASE: /core/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
